<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 검색 · Bible Search</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body data-theme="light">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="hd-left">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="책 목록 열기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a class="brand" href="#" onclick="App.showWelcome(); return false;">
          <span class="brand-cross">✝</span>
          <span class="brand-text">성경<em>Bible</em></span>
        </a>
      </div>

      <div class="hd-center">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            class="search-input"
            id="searchInput"
            type="text"
            placeholder="구절 검색 · 예: 요 3:16 / John 3:16 / 태초에"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="search-clear" id="searchClear" aria-label="지우기" style="display:none">✕</button>
        </div>
      </div>

      <div class="hd-right">
        <select class="version-select" id="versionSelect" title="성경 버전 선택">
          <optgroup label="한국어">
            <option value="krv">개역한글 (KRV)</option>
            <option value="korean">공동번역</option>
          </optgroup>
          <optgroup label="English">
            <option value="kjv">KJV</option>
            <option value="web">WEB</option>
            <option value="asv">ASV</option>
          </optgroup>
        </select>
        <button class="icon-btn theme-btn" id="themeBtn" title="테마 변경">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== LAYOUT ===== -->
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="testament-tabs">
          <button class="t-tab active" data-tab="old">구약 <span>39</span></button>
          <button class="t-tab" data-tab="new">신약 <span>27</span></button>
        </div>
        <div class="book-filter-wrap">
          <input class="book-filter" id="bookFilter" type="text" placeholder="책 이름 검색..." autocomplete="off">
        </div>
        <ul class="book-list" id="bookList" role="listbox" aria-label="성경 책 목록"></ul>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- MAIN -->
    <main class="main" id="main">

      <!-- Welcome -->
      <section class="welcome" id="welcomeScreen">
        <div class="welcome-cross">✝</div>
        <h1>성경 검색</h1>
        <p>좌측에서 책을 선택하거나 구절을 검색하세요<br><small>Select a book or search for a verse above</small></p>

        <div class="quick-section">
          <h3>자주 찾는 구절 · Popular Passages</h3>
          <div class="quick-grid" id="quickGrid">
            <button data-book="43" data-ch="3">요한복음 3장<span>John 3</span></button>
            <button data-book="19" data-ch="23">시편 23편<span>Psalm 23</span></button>
            <button data-book="40" data-ch="5">마태복음 5장<span>Matthew 5</span></button>
            <button data-book="1"  data-ch="1">창세기 1장<span>Genesis 1</span></button>
            <button data-book="45" data-ch="8">로마서 8장<span>Romans 8</span></button>
            <button data-book="46" data-ch="13">고린도전서 13장<span>1 Cor 13</span></button>
            <button data-book="20" data-ch="3">잠언 3장<span>Proverbs 3</span></button>
            <button data-book="58" data-ch="11">히브리서 11장<span>Hebrews 11</span></button>
          </div>
        </div>

        <div class="quick-section">
          <h3>지원 버전 · Supported Versions</h3>
          <div class="version-tags">
            <span class="vtag ko">개역한글 (KRV)</span>
            <span class="vtag ko">공동번역</span>
            <span class="vtag en">KJV</span>
            <span class="vtag en">WEB</span>
            <span class="vtag en">ASV</span>
          </div>
        </div>
      </section>

      <!-- Reading View -->
      <section class="reading" id="readingScreen" style="display:none">
        <div class="reading-header">
          <button class="nav-ch-btn" id="prevChBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>
          </button>
          <div class="reading-title">
            <h2 id="chapterTitle"></h2>
            <span class="ver-badge" id="verBadge"></span>
          </div>
          <button class="nav-ch-btn" id="nextChBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>
          </button>
        </div>

        <div class="ch-picker-wrap">
          <span class="ch-picker-label">장 이동:</span>
          <div class="ch-picker" id="chPicker"></div>
        </div>

        <div class="verses-wrap" id="versesWrap"></div>

        <div class="reading-footer">
          <button class="nav-lg-btn" id="prevChBtn2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>
            이전 장
          </button>
          <button class="nav-lg-btn" id="nextChBtn2">
            다음 장
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>
          </button>
        </div>
      </section>

      <!-- Search Results -->
      <section class="search-results" id="searchScreen" style="display:none">
        <div class="sr-header">
          <div>
            <h2 id="srTitle"></h2>
            <p id="srSubtitle" class="sr-subtitle"></p>
          </div>
          <button class="sr-close" id="srClose">✕ 닫기</button>
        </div>
        <div class="sr-list" id="srList"></div>
      </section>

      <!-- Loading -->
      <div class="loading" id="loadingScreen" style="display:none">
        <div class="spinner"></div>
        <p>불러오는 중...</p>
      </div>

    </main>
  </div>

  <!-- Font size FAB -->
  <div class="font-fab">
    <button class="font-fab-btn" id="fontDown" title="글자 작게">A-</button>
    <button class="font-fab-btn" id="fontUp" title="글자 크게">A+</button>
  </div>

  <!-- Compare toggle button -->
  <button class="compare-btn" id="compareBtn" title="두 버전 비교" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/></svg>
  </button>

  <!-- Toast -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
